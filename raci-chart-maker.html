/* Layout: document page. Sticky toolbar, title block, letter legend, the chart (people columns, task and phase rows, a check column), then checks, workload and who-does-what. Dialogs for charts, new, examples and the read me. */
:root{
  --paper:#f5f6f3; --sheet:#ffffff; --ink:#1e2a2f; --muted:#5d6b70; --line:#d5dbd8; --late:#b8432a; --att:#a86c12; --ok:#3a744e; --sel:#1f6feb;
  --acc:#46588c;
  --c1:#2f5d73; --c2:#a86c12; --c3:#3a744e; --c4:#7a4a86; --c5:#b8432a; --c6:#5f6b1f; --c7:#46588c;
  --lR:var(--c1); --lA:var(--acc); --lC:var(--c2); --lI:var(--muted);
  --display:"Archivo",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a1c; --sheet:#1b2326; --ink:#e6ecea; --muted:#9aa8ac; --line:#2f3a3e; --late:#ef8a72; --att:#e0a548; --ok:#7cc296; --sel:#6aa7ff;
  --acc:#9aaee0;
  --c1:#7fb3cc; --c2:#e0a548; --c3:#7cc296; --c4:#c39ad0; --c5:#ef8a72; --c6:#c4c27a; --c7:#9aaee0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a1c; --sheet:#1b2326; --ink:#e6ecea; --muted:#9aa8ac; --line:#2f3a3e; --late:#ef8a72; --att:#e0a548; --ok:#7cc296; --sel:#6aa7ff;
  --acc:#9aaee0;
  --c1:#7fb3cc; --c2:#e0a548; --c3:#7cc296; --c4:#c39ad0; --c5:#ef8a72; --c6:#c4c27a; --c7:#9aaee0; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:1.35rem;font-weight:700}
p{margin:0}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.small{font-size:.85rem;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.sec{display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:end}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick select{font:800 1.02rem/1.2 var(--display);border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:4px 8px;max-width:min(420px,80vw);cursor:pointer}
.status{font-size:.85rem;color:var(--muted)}
.status.dirty{color:var(--att);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.grp{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:5px 11px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.copybox{max-width:1180px;margin:0 auto;padding-block:0 12px;display:flex;flex-direction:column;gap:6px}
.copybox textarea{width:100%;box-sizing:border-box;min-height:160px;font:13px/1.4 var(--mono);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}

/* editable text */
.ed{border:0;background:transparent;border-bottom:1px dashed transparent;border-radius:0;padding:1px 2px;width:100%;box-sizing:border-box;min-width:0}
.ed:hover{border-bottom-color:var(--muted)}
.ed:focus{outline:none;border-bottom:1px solid var(--sel);background:color-mix(in srgb,var(--sel) 6%,transparent)}
.ed::placeholder{color:var(--muted);font-style:italic;opacity:.8}
textarea.ed{resize:none;overflow:hidden;line-height:1.45;display:block}

/* title block */
header{display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:20px}
header .t{font:800 clamp(1.9rem,4vw,2.6rem)/1.15 var(--display);letter-spacing:-.01em}
header .q{font-size:1.1rem;color:var(--muted);max-width:75ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.9rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}

/* letters */
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 5px;box-sizing:border-box;border-radius:5px;font:700 .9rem/1 var(--display);letter-spacing:.02em}
.L-R{background:color-mix(in srgb,var(--lR) 20%,var(--sheet));color:var(--lR)}
.L-A,.L-AR{background:var(--lA);color:var(--sheet)}
.L-C{background:color-mix(in srgb,var(--lC) 18%,var(--sheet));color:var(--lC)}
.L-I{background:color-mix(in srgb,var(--lI) 14%,var(--sheet));color:var(--lI)}

/* chart */
.mx-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}

I"},t6:{p1:"AR",p2:"C",p3:"C"},t7:{p1:"A",p2:"R",p3:"R"},t9:{p1:"R",p6:"A",p5:"C"},t10:{p5:"R",p1:"A",p6:"I"},t11:{p6:"A",p1:"R",p5:"I",p2:"I",p3:"I",p4:"I"}}}},{key:"move",title:"Office move",desc:"Moving a team of 40 to a new office, from choosing the space to the first week there.",c:{title:"Office move",desc:"Who decides, plans and does each part of the move.",people:[{id:"p1",name:"Director",note:""},{id:"p2",name:"Office manager",note:""},{id:"p3",name:"Facilities",note:""},{id:"p4",name:"IT",note:""},{id:"p5",name:"Finance",note:""},{id:"p6",name:"Team leads",note:""},{id:"p7",name:"All staff",note:""}],tasks:[{id:"h1",name:"Decide",head:!0},{id:"t2",name:"Choose the new space"},{id:"t3",name:"Sign the lease"},{id:"h4",name:"Plan",head:!0},{id:"t5",name:"Plan the floor layout"},{id:"t6",name:"Book the movers"},{id:"t7",name:"Move the network and phones"},{id:"h8",name:"Move",head:!0},{id:"t9",name:"Pack desks"},{id:"t10",name:"Moving weekend"},{id:"t11",name:"Settle-in survey"}],cells:{t2:{p1:"A",p2:"R",p5:"C",p6:"C"},t3:{p1:"A",p5:"R",p2:"C"},t5:{p2:"R",p1:"A",p6:"C",p3:"C",p4:"C"},t6:{p2:"AR",p5:"C"},t7:{p4:"AR",p3:"C",p2:"I"},t9:{p7:"R",p6:"A",p2:"I"},t10:{p3:"R",p4:"R",p2:"A",p7:"I"},t11:{p2:"AR",p7:"C",p1:"I"}}}}],t='<p>RACI Chart Maker shows who does what on a project or process, and checks the chart for the gaps that cause dropped balls and turf wars. It keeps any number of charts in one file. Each chart has:</p>\n<ul>\n<li><strong>Tasks</strong> down the side, grouped into phases if you like.</li>\n<li><strong>People or roles</strong> across the top.</li>\n<li><strong>A letter in each cell</strong> saying how that person is involved in that task.</li>\n<li><strong>Checks</strong> that flag tasks nobody owns, tasks with two owners and tasks nobody is doing.</li>\n<li><strong>Workload</strong> for each person, and a <strong>Who does what</strong> list you can hand to each of them.</li>\n</ul>\n<h2 id="rm-getting-started">Getting started</h2>\n<ol>\n<li>Open the file in Chrome, Edge or another up-to-date browser. Nothing needs to be installed.</li>\n<li>Click <strong>Examples</strong> and open one to see a finished chart.</li>\n<li>Click <strong>+ New chart</strong> to start your own.</li>\n<li>To keep your work, click <strong>Download HTML</strong>.</li>\n</ol>\n<h2 id="rm-letters">What the letters mean</h2>\n<table>\n<thead><tr><th>Letter</th><th>Means</th><th>How many per task</th></tr></thead>\n<tbody>\n<tr><td><strong>R</strong> Responsible</td><td>Does the work.</td><td>At least one</td></tr>\n<tr><td><strong>A</strong> Accountable</td><td>Owns the result, makes the final call and signs it off.</td><td>Exactly one</td></tr>\n<tr><td><strong>A/R</strong></td><td>Owns the result and does the work too. Common on small teams.</td><td>Counts as both</td></tr>\n<tr><td><strong>C</strong> Consulted</td><td>Asked for input before or during the work. A two-way conversation.</td><td>As few as you need</td></tr>\n<tr><td><strong>I</strong> Informed</td><td>Told when it\'s done or when something changes. One-way.</td><td>Anyone who needs to know</td></tr>\n</tbody>\n</table>\n<h2 id="rm-examples">Examples</h2>\n<p>Click <strong>Examples</strong>, then <strong>Open a copy</strong> on any card. The example opens as a new chart with "(example)" in its name, and your other charts aren\'t touched. When you\'re done, delete it from <strong>Charts</strong>.</p>\n<table>\n<thead><tr><th>Example</th><th>What it shows</th></tr></thead>\n<tbody>\n<tr><td>Website redesign</td><td>A project in four phases, with two problems left in for you to find and fix</td></tr>\n<tr><td>New employee onboarding</td><td>A repeating process shared between HR, IT, a manager and a buddy</td></tr>\n<tr><td>Month-end close</td><td>A finance routine where one person owns most of the steps</td></tr>\n<tr><td>Office move</td><td>Seven groups, including "All staff" as one column</td></tr>\n</tbody>\n</table>\n<h2 id="rm-charts">Charts</h2>\n<table>\n<thead><tr><th>To</th><th>Do this</th></tr></thead>\n<tbody>\n<tr><td>Start a new one</td><td><strong>+ New chart</strong>, give it a name, then pick <strong>Blank chart</strong> or <strong>Copy of this chart</strong></td></tr>\n<tr><td>Start from an example</td><td><strong>Examples</strong>, then <strong>Open a copy</strong></td></tr>\n<tr><td>Switch</td><td>Use the menu at the top left, or open <strong>Charts</strong> and click a name</td></tr>\n<tr><td>Rename</td><td>Click the large title and type</td></tr>\n<tr><td>Duplicate</td><td><strong>Charts</strong>, then <strong>Duplicate this chart</strong></td></tr>\n<tr><td>Delete</td><td><strong>Charts</strong>, then the <strong>×</strong> next to a chart. Click a second time to confirm. Deleting the last chart leaves a blank one in its place.</td></tr>\n</tbody>\n</table>\n<p>To get a deleted chart back, close the file without downloading it. Your last downloaded copy still has it.</p>\n<h2 id="rm-building">Building the chart</h2>\n<ul>\n<li><strong>People</strong> are the columns. Type a name or a role, and an optional note such as a team or a person\'s name. Use <strong>+ Add person</strong> for more, the arrows to reorder and <strong>×</strong> to remove. Roles usually work better than names, because the chart stays right when people change jobs.</li>\n<li><strong>Tasks</strong> are the rows. Start each with a verb, such as "Approve the budget". Use <strong>+ Add task</strong>, or <strong>+</strong> on a row to add one just below it.</li>\n<li><strong>Phases</strong> group tasks under a heading, such as Plan, Build and Launch. Use <strong>+ Add phase</strong>, then move it into place with the arrows.</li>\n<li><strong>Letters:</strong> click a cell to step through R, A, A/R, C, I and empty. Shift-click steps backwards. Or select a cell and type R, A, C or I.</li>\n</ul>\n<h2 id="rm-checks">The checks</h2>\n<p>The last column shows a check mark when a task is set up well, or a short note when it isn\'t. The <strong>Checks</strong> section lists every problem in one place. Click one to jump to it.</p>\n<table>\n<thead><tr><th>Note</th><th>What it means</th><th>Fix</th></tr></thead>\n<tbody>\n<tr><td>No A</td><td>Nobody owns the result, so nobody makes the final call.</td><td>Give one person an A.</td></tr>\n<tr><td>2 A\'s</td><td>Two owners usually means no owner.</td><td>Keep one A and change the other to R or C.</td></tr>\n<tr><td>No R</td><td>Nobody is doing the work.</td><td>Give someone an R, or make the owner A/R.</td></tr>\n<tr><td>Many C</td><td>Four or more people to consult slows the task down.</td><td>Change some to I if they only need to know.</td></tr>\n<tr><td>No tasks</td><td>A person has nothing on the chart.</td><td>Give them a part, or remove the column.</td></tr>\n</tbody>\n</table>\n<h2 id="rm-workload">Workload and who does what</h2>\n<ul>\n<li><strong>Workload</strong> shows a bar for each person, split into their R, A, C and I tasks. Someone with far more R and A than the rest of the team is marked <strong>Heavy load</strong>.</li>\n<li><strong>Who does what</strong> lists each person\'s tasks, grouped by letter. Print it and hand each person their part, or paste it into an email.</li>\n</ul>\n<h2 id="rm-saving">Saving and sharing</h2>\n<ul>\n<li><strong>Download HTML</strong> saves the whole tool, with every chart, as one file. Each download is a new copy, so keep using the newest one.</li>\n<li><strong>Print / Save as PDF</strong> prints the open chart in landscape, with the controls hidden. Who does what starts on a new page. Choose "Save as PDF" as the printer.</li>\n<li><strong>Copy as text</strong> copies the chart as a table, with tabs between the columns, followed by any problems and each person\'s list. Paste it into Excel or Google Sheets and it lands in cells. Paste it into an email and it reads as a list.</li>\n<li><strong>Undo / Redo</strong> (Ctrl+Z / Ctrl+Y) cover every change to the open chart. Each chart keeps its own history until you close the page.</li>\n</ul>\n<h2 id="rm-keys">Keyboard shortcuts</h2>\n<table>\n<thead><tr><th>Key</th><th>Does</th></tr></thead>\n<tbody>\n<tr><td>R, A, C, I</td><td>Set the letter in the selected cell. Typing R on an A, or A on an R, makes it A/R. Typing a letter that\'s already there removes it.</td></tr>\n<tr><td>Space or Enter</td><td>Step to the next letter</td></tr>\n<tr><td>Delete or Backspace</td><td>Clear the selected cell</td></tr>\n<tr><td>Arrow keys</td><td>Move between cells</td></tr>\n<tr><td>Ctrl+Z / Ctrl+Y</td><td>Undo / redo</td></tr>\n<tr><td>Ctrl+S</td><td>Download a copy with your changes</td></tr>\n<tr><td>Esc</td><td>Close a dialog</td></tr>\n</tbody>\n</table>\n<p>On a Mac, use Cmd instead of Ctrl.</p>\n<h2 id="rm-good-to-know">Good to know</h2>\n<ul>\n<li>Agree the chart with the people on it. A RACI chart works because everyone has seen it and said yes, not because it\'s filled in.</li>\n<li>Keep tasks at the level where ownership changes. "Write page copy" is a good task. "Write the About page" is probably too small.</li>\n<li>Your charts live inside the file itself, with nothing stored anywhere else. A downloaded file is a complete backup, and you can email it like any other document.</li>\n<li>To share your work, send the file or a PDF. Each person\'s copy of the file is separate, so agree on who keeps the master copy.</li>\n<li>For the person maintaining it: the tool is plain HTML and JavaScript with no libraries. The charts are stored as JSON in the <code>&lt;script id="data"&gt;</code> block near the top of the file.</li>\n</ul>\n<h2 id="rm-license">License</h2>\n<p>Thank you for buying this tool. Your Gumroad receipt shows which license you have.</p>\n<ul>\n<li><strong>Personal license:</strong> for use by one person, for personal or business work.</li>\n<li><strong>Team license:</strong> for use by everyone in one company or organization.</li>\n</ul>\n<p>Either way, you may not resell, share publicly or give away this file or changed versi
