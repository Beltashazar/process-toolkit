/* Layout: document page. Sticky toolbar, title block, drawn swimlane flow chart, step table (lanes = roles, columns = stages), then free-form sections, review notes and footer. Dialogs for workflows, new, examples and the read me. */
:root{
  --paper:#f5f6f3; --sheet:#ffffff; --ink:#1e2a2f; --muted:#5d6b70; --line:#d5dbd8; --late:#b8432a; --att:#a86c12; --sel:#1f6feb;
  --c1:#2f5d73; --c2:#a86c12; --c3:#3a744e; --c4:#7a4a86; --c5:#b8432a; --c6:#5f6b1f; --c7:#46588c;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a1c; --sheet:#1b2326; --ink:#e6ecea; --muted:#9aa8ac; --line:#2f3a3e; --late:#ef8a72; --att:#e0a548; --sel:#6aa7ff;
  --c1:#7fb3cc; --c2:#e0a548; --c3:#7cc296; --c4:#c39ad0; --c5:#ef8a72; --c6:#c4c27a; --c7:#9aaee0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a1c; --sheet:#1b2326; --ink:#e6ecea; --muted:#9aa8ac; --line:#2f3a3e; --late:#ef8a72; --att:#e0a548; --sel:#6aa7ff;
  --c1:#7fb3cc; --c2:#e0a548; --c3:#7cc296; --c4:#c39ad0; --c5:#ef8a72; --c6:#c4c27a; --c7:#9aaee0; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.lede{max-width:70ch;color:var(--muted);font-size:1.05rem;display:block}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
.sec{display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick select{font:800 1.02rem/1.2 var(--display);border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:4px 8px;max-width:min(420px,80vw);cursor:pointer}
.status{font-size:.85rem;color:var(--muted)}
.status.dirty{color:var(--att);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.grp{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:5px 11px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.danger{color:var(--late)}
.btn:disabled{opacity:.4;cursor:default}
.copybox{max-width:1180px;margin:0 auto;padding-block:0 12px;display:flex;flex-direction:column;gap:6px}
.copybox textarea{width:100%;box-sizing:border-box;min-height:140px;font:13px/1.4 var(--mono);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}

/* editing affordances */
[contenteditable]{outline:1px dashed var(--muted);outline-offset:1px;border-radius:2px;cursor:text;min-width:2ch;display:inline-block}
[contenteditable]:focus{outline:2px solid var(--sel);background:var(--sheet)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.ctl{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.ib{border:1px solid var(--line);background:var(--sheet);border-radius:3px;min-width:22px;height:22px;line-height:1;padding:0 4px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.ib:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.add{align-self:flex-start;border:1px dashed var(--muted);background:transparent;border-radius:4px;padding:3px 10px;font-size:.82rem;color:var(--muted);cursor:pointer}
.add:hover{color:var(--ink);border-color:var(--ink)}
.ctl-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center}
.ctl-row .add{font-size:.75rem;padding:2px 8px}
.ordchips{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:6px;font-size:.72rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;padding:0 2px 0 7px;background:var(--sheet);color:var(--ink)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--lc)}
.chip .ib{min-width:16px;height:16px;border:0;font-size:.7rem}

e:"Publish",order:["edi","wri","des"],cells:{edi:{tag:"Tue / Thu",flow:"Publish and share",items:["Newsletter and social posts."]},wri:{tag:"",flow:"Reply to comments",items:["For the first two days."]},des:{tag:"",flow:"",items:["Nothing to do."]}}}],sections:[{id:"x1",type:"list",title:"Style guide",items:[{b:"Plain words.",t:"Write the way you would explain it to a friend."},{b:"Short paragraphs.",t:"Three or four sentences at most."},{b:"One idea per post.",t:"Save the rest for another article."}]},{id:"x2",type:"rows",accent:!1,eyebrow:"",title:"Content types",intro:"",rows:[{k:"How-to guide",v:"800 to 1,200 words, with screenshots."},{k:"News post",v:"300 to 500 words, published the same day."},{k:"Case study",v:"Approved by the customer before publishing."}]},{id:"x3",type:"phases",title:"This quarter",items:[{b:"Plan the calendar.",t:"Agree themes for each month.",tag:"Week 1"},{b:"Publish twice a week.",t:"Tuesdays and Thursdays.",tag:"Ongoing"},{b:"Review results.",t:"Keep what worked, drop what did not.",tag:"Week 12"}]}],notes:[],footer:"Example workflow."}}],t='<p>Workflow Planner turns a process into a one-page plan you can edit, share and print.\nIt keeps any number of workflows in one file. Each workflow has:</p>\n<ul>\n<li><strong>A title block:</strong> what the workflow is, who uses it and what it connects to.</li>\n<li><strong>A flow chart at a glance:</strong> boxes in lanes for each role, joined by arrows, drawn\n  automatically from the steps.</li>\n<li><strong>A step-by-step table:</strong> every stage, with what each role does in it.</li>\n<li><strong>Supporting sections:</strong> tables, bullet lists, numbered phases or a status board,\n  for exceptions, rules, rollout plans and anything else the reader needs.</li>\n<li><strong>Review notes:</strong> questions and changes for the next version.</li>\n</ul>\n<h2 id="rm-getting-started">Getting started</h2>\n<ol>\n<li>Open the file in Chrome, Edge or another up-to-date browser. Nothing needs to be\n   installed.</li>\n<li>Click <strong>Examples</strong> and open one to see a finished workflow.</li>\n<li>Click <strong>+ New</strong> to start your own, then click <strong>Edit</strong> and fill it in.</li>\n<li>To keep your work, click <strong>Download HTML</strong>.</li>\n</ol>\n<h2 id="rm-examples">Examples</h2>\n<p>Click <strong>Examples</strong>, then <strong>Open a copy</strong> on any card. The example opens as a new\nworkflow with "(example)" in its name, and your other workflows aren\'t touched.\nWhen you\'re done, delete it from <strong>Workflows</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Example</th>\n<th>What it shows</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Purchase request approval</td>\n<td>Three roles, a decline-and-revise loop, an exceptions table, rules and a rollout plan</td>\n</tr>\n<tr>\n<td>Customer onboarding</td>\n<td>Five stages from sales handoff to go-live, plus a status board</td>\n</tr>\n<tr>\n<td>Content publishing</td>\n<td>A writer, editor and designer, with a send-back loop and a style guide</td>\n</tr>\n</tbody>\n</table>\n<h2 id="rm-workflows">Workflows</h2>\n<table>\n<thead>\n<tr>\n<th>To</th>\n<th>Do this</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Start a new one</td>\n<td><strong>+ New</strong>, give it a name, then pick <strong>Blank workflow</strong> or <strong>Copy of this workflow</strong></td>\n</tr>\n<tr>\n<td>Start from an example</td>\n<td><strong>Examples</strong>, then <strong>Open a copy</strong></td>\n</tr>\n<tr>\n<td>Switch</td>\n<td>Use the menu at the top left, or open <strong>Workflows</strong> and click a name</td>\n</tr>\n<tr>\n<td>Rename</td>\n<td>Click <strong>Edit</strong>, then change the large title</td>\n</tr>\n<tr>\n<td>Duplicate</td>\n<td><strong>Workflows</strong>, then <strong>Duplicate this workflow</strong></td>\n</tr>\n<tr>\n<td>Delete</td>\n<td><strong>Workflows</strong>, then the <strong>×</strong> next to a workflow. Click a second time to confirm. Deleting the last workflow leaves a blank one in its place.</td>\n</tr>\n</tbody>\n</table>\n<p>To get a deleted workflow back, close the file without downloading it. Your last\ndownloaded copy still has it.</p>\n<h2 id="rm-editing">Editing</h2>\n<p>Click <strong>Edit</strong> to start. Every piece of text gets a dashed outline, so click any\ntext and type. Small buttons appear for adding, moving and removing things. Click\n<strong>Done editing</strong> to see the clean page.</p>\n<ul>\n<li><strong>Title block:</strong> edit the label, title and description, and the info lines on the\n  right. Use <strong>+ Add line</strong> for more info lines.</li>\n<li><strong>Lanes (roles):</strong> in the step-by-step table, each lane has its name, a short\n  name for the chart, a description and a color. Use the arrows to reorder lanes,\n  <strong>×</strong> to remove one, and <strong>+ Add lane</strong> for more.</li>\n<li><strong>Stages:</strong> each stage is a column. Rename it in its heading. Use <strong>←</strong> and <strong>→</strong>\n  to move it, <strong>+ Stage after</strong> to add one, and <strong>Remove</strong> to delete it.</li>\n<li><strong>Steps:</strong> each cell lists what one role does in one stage. Add, reorder or\n  remove steps with the small buttons. The optional tag at the top of a cell is for\n  quick facts like "~5 min" or "One click".</li>\n<li><strong>Undo / Redo</strong> (Ctrl+Z / Ctrl+Y) reverse changes, as well as the buttons in the\n  toolbar while you edit.</li>\n</ul>\n<h2 id="rm-the-flow-chart">The flow chart</h2>\n<p>The chart is drawn from the step-by-step table, so it updates as you edit.</p>\n<ul>\n<li><strong>Chart box:</strong> each cell has a short <strong>Chart box</strong> label. That text is what\n  appears on the chart. Leave it blank to keep that role off the chart for that\n  stage.</li>\n<li><strong>Chart order:</strong> under each stage heading, move the lanes left or right to set\n  which box the arrows go through first in that stage.</li>\n<li><strong>Start and end:</strong> set the start and end labels in <strong>Chart settings</strong> under the\n  chart.</li>\n<li><strong>Dashed arrows:</strong> use <strong>Chart settings</strong> for loops and side events, like\n  "Declined: revise" or "Scope added". Pick which box each one comes from and goes\n  to. <strong>Side event</strong> draws it from the top of the chart.</li>\n<li><strong>Click a box</strong> (outside edit mode) to jump to that step\'s details. In edit mode,\n  clicking a box takes you to its label.</li>\n</ul>\n<h2 id="rm-supporting-sections">Supporting sections</h2>\n<p>Below the table, add as many sections as you need with <strong>+ Add section</strong>:</p>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Good for</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Table of rows</td>\n<td>Exceptions, changes, or "if this, then that"</td>\n</tr>\n<tr>\n<td>Bullet list</td>\n<td>Rules, benefits, open decisions</td>\n</tr>\n<tr>\n<td>Numbered phases</td>\n<td>Rollout plans and timelines, each with a short "when" tag</td>\n</tr>\n<tr>\n<td>Status board</td>\n<td>Example columns and cards showing how work is tracked</td>\n</tr>\n</tbody>\n</table>\n<p>Use the arrows on each section to reorder it, and <strong>Remove</strong> to delete it. On a\nstatus board, each column can be marked <strong>Attention</strong> or <strong>Late</strong> to color it.</p>\n<h2 id="rm-review-notes">Review notes</h2>\n<p>In edit mode, <strong>Review notes</strong> collects questions and changes for the next version.\nThe notes are hidden on the clean page unless there are some.</p>\n<h2 id="rm-saving-and-sharing">Saving and sharing</h2>\n<ul>\n<li><strong>Download HTML</strong> saves the whole tool, with every workflow, as one file. Each\n  download is a new copy, so keep using the newest one.</li>\n<li><strong>Print / Save as PDF</strong> prints the open workflow in landscape, with the editing\n  controls hidden. Choose "Save as PDF" as the printer.</li>\n<li><strong>Copy as text</strong> copies
